    vanilla_tweaks_post_url: "https://vanillatweaks.net/assets/server/zipdatapacks.php"
    decorative_cosmetic: ["wandering trades", "armor statues", "more mob heads", "player head drops", "silence mobs"]
    informative: ["spawning spheres", "wandering trader announcements", "durability ping"]
    packs_json: |
          {"decorative-cosmetic": {{ decorative_cosmetic | to_json }}, "informative": {{ informative | to_json }}}
    vanilla_tweaks_body: "packs={{ packs_json | urlencode }}&version=1.21"
    vanilla_tweaks_download_dest: "{{ resource_packs_dir }}/VanillaTweaks_UNZIP_ME.zip"
  tasks:
    - name: Clean and create mod staging directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
        owner: "{{ minecraft_user }}"
        group: "{{ minecraft_group }}"
      loop:
        - "{{ client_mods_dir }}"
        - "{{ resource_packs_dir }}"
      become: true
      become_user: "{{ root_user }}"
      tags: [client_mods]

    - name: Wipe existing JARs and ZIPs in staging folder to eliminate stale versions
      ansible.builtin.shell: |
        rm -f {{ client_mods_dir }}/*.jar
        rm -f {{ resource_packs_dir }}/*.zip
      become: true
      become_user: "{{ minecraft_user }}"
      tags: [client_mods]

    - name: Download Fabric installer exe
      ansible.builtin.get_url: 
        url: "{{ download_url }}"
        dest: "{{ client_mods_dir }}/fabric-installer.exe"
      become: true
      become_user: "{{ minecraft_user }}"
      tags: [client_mods]

    - name: Query Modrinth API for client mods
      ansible.builtin.uri:
        url: >-
          https://api.modrinth.com/v2/project/{{ item }}/version?loaders=%5B%22{{ modloader }}%22%5D&game_versions=%5B%22{{ minecraft_version }}%22%5D
        method: GET
        headers:
          User-Agent: "HolmesCraft-ClientPacker/1.0 (admin@holmescraft.internal)"
        return_content: true
        status_code: [200, 404]
      loop: "{{ client_mod_slugs }}"
      register: client_mod_responses
      check_mode: false
      tags: [client_mods]

    - name: Verify all client mods are present for {{ minecraft_version }}
      ansible.builtin.assert:
        that:
          - item.status == 200
          - item.json is defined
          - (item.json | length) > 0
        fail_msg: >-
          Client mod '{{ item.item }}' failed validation!
          {% if item.status == 404 %}
          Reason: Project not found on Modrinth (check slug or ID).
          {% else %}
          Reason: No compatible release found for Minecraft {{ minecraft_version }} on {{ modloader }}.
          {% endif %}
      loop: "{{ client_mod_responses.results }}"
      tags: [client_mods]

    - name: Download client mod JARs
      ansible.builtin.get_url:
        url: "{{ (item.json[0].files | selectattr('primary', 'defined') | selectattr('primary') | list | first | default(item.json[0].files[0])).url }}"
        dest: "{{ client_mods_dir }}/{{ (item.json[0].files | selectattr('primary', 'defined') | selectattr('primary') | list | first | default(item.json[0].files[0])).filename }}"
        mode: '0644'
      loop: "{{ client_mod_responses.results }}"
      become: true
      become_user: "{{ minecraft_user }}"
      tags: [client_mods]

    - name: Query Modrinth API for resource packs
      ansible.builtin.uri:
        url: >-
          https://api.modrinth.com/v2/project/{{ item }}/version?game_versions=%5B%22{{ minecraft_version }}%22%5D
        method: GET
        headers:
          User-Agent: "HolmesCraft-ClientPacker/1.0 (admin@holmescraft.internal)"
        return_content: true
        status_code: [200, 404]
      loop: "{{ resource_pack_slugs }}"
      register: resource_pack_responses
      check_mode: false
      tags: [client_mods]

    - name: Download resource packs
      ansible.builtin.get_url:
        url: "{{ (item.json[0].files | selectattr('primary', 'defined') | selectattr('primary') | list | first | default(item.json[0].files[0])).url }}"
        dest: "{{ resource_packs_dir }}/{{ (item.json[0].files | selectattr('primary', 'defined') | selectattr('primary') | list | first | default(item.json[0].files[0])).filename }}"
        mode: '0644'
      loop: "{{ resource_pack_responses.results }}"
      when: item.status == 200 and (item.json | length) > 0
      become: true
      become_user: "{{ minecraft_user }}"
      tags: [client_mods]

    - name: Prepare POST body for VanillaTweaks
      ansible.builtin.uri:
        url: "{{ vanilla_tweaks_post_url }}"
        method: POST
        body_format: form-urlencoded
        body: "{{ vanilla_tweaks_body }}"
        return_content: true
        status_code: 200
      register: vanilla_tweaks_post_response
      check_mode: false
      tags: [client_mods]

    - name: Download VanillaTweaks client pack
      ansible.builtin.get_url:
        url: "https://vanillatweaks.net{{ vanilla_tweaks_post_response.json.link }}"
        dest: "{{ vanilla_tweaks_download_dest }}"
      when: vanilla_tweaks_post_response.json.link is defined
      become: true
      become_user: "{{ minecraft_user }}"
      tags: [client_mods]

    - name: Package client mods and resource packs into zip
      community.general.archive:
        path: "{{ client_mods_dir }}"
        dest: "/opt/client-mods/client-mods-{{ minecraft_version }}.zip"
        format: zip
      become: true
      become_user: "{{ minecraft_user }}"
      tags: [client_mods]

    - name: Setup Complete
      ansible.builtin.debug:
        msg: "Client bundle ready at /opt/client-mods/client-mods-{{ minecraft_version }}.zip"
      tags: [client_mods]


