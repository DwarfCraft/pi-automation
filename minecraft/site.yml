---
- hosts: all
  vars: 
    packages: 
      - wget
      - python3
      - git
      - vim
      - curl
      - python3-pip
      - tmux
      - rsyslog
      - whois
      - lame-libs
    minecraft_user: mine_user
    minecraft_group: mine_user
    minecraft_home: /opt/minecraft
    backup_dir: /opt/backups
    level_seed: 5103687417315433447
    motd_message: "The HolmesCraft Server"
    spawn_protection: 0
    difficulty: hard
    level_name: "world"
    view_distance: 32
    # minecraft_version: 26.3
    #download_url: https://piston-data.mojang.com/v1/objects/4707d00eb834b446575d89a61a11b5d548d8c001/server.jar
    # Fabric Loader 0.16.14
    download_url: https://meta.fabricmc.net/v2/versions/loader/26.3/0.19.5/1.1.2/server/jar
    root_user: root
    root_group: root
# Target versions
    minecraft_version: "26.3"
    modloader: "fabric"
    mods_dir: "{{ minecraft_home }}/mods"
    datapacks_dir: "{{ minecraft_home }}/{{ level_name }}/datapacks"

    # Modrinth Project Slugs / IDs for Server Mods
    server_mod_slugs:
      - fabric-api
      - lithium
      - ferrite-core
      - simple-voice-chat
      - spark
      - peek
      - status
      - freecam
      - axiom
      - camera-utils
      - chat-heads
      - chat-signing-hider
      - entityculling
      - entitytexturefeatures
      - entity-model-features
      - fast-trading
      - immediatelyfast
      - modmenu
      - moreculling
      - server-resource-pack-checker
      - shulkerboxtooltip
      - krypton
      - cloth-config
      - enhanced-groups
      - collective
      - armor-poser
      - player-head-drops
      - just-mob-heads
      - audioplayer
      - inhabitor
      - view-distance-fix

    # Modrinth Project Slugs / IDs for Server Datapacks
    server_datapack_slugs:
      - armor-statues
      - custom-roleplay-data
      - name-formatting-station

    fabric_mods:
    # Fabric Mods for 1.21.10
      #- https://cdn.modrinth.com/data/kPkTtp4N/versions/7qLQenlv/coordfinder-fabric-1.21.10-1.1.0.jar
