      - https://cdn.modrinth.com/data/l6YH9Als/versions/1CB3cS0m/spark-1.10.156-fabric.jar
      - https://cdn.modrinth.com/data/e0M1UDsY/versions/T8rv7kwo/collective-1.21.11-8.13.jar
      - https://cdn.modrinth.com/data/PFwYNrHb/versions/nkNfOD50/ArmorPoser-fabric-1.21.11-13.1.0.jar
      - https://cdn.modrinth.com/data/cz5Ve1NT/versions/JVA3SQni/player-drops-head-v3.4.1.jar
      - https://cdn.modrinth.com/data/jzTUm9hE/versions/cVsrTAJ5/justmobheads-1.21.11-8.9.jar
    # Fabric Mods for 26.3
      - https://cdn.modrinth.com/data/N6n5dqoA/versions/EjUybJv3/Axiom-6.1.2-for-MC26.3.jar
      - https://cdn.modrinth.com/data/rrwQMaWQ/versions/5XAah6bJ/camerautils-fabric-1.1.2%2B26.3.jar
      - https://cdn.modrinth.com/data/Wb5oqrBJ/versions/R2zOq4xG/chat_heads-1.2.9-fabric-26.3.jar
      - https://cdn.modrinth.com/data/6KrNtW32/versions/NdGAWgGG/chatsigninghider-fabric-1.0.5%2B26.3.jar
      - https://cdn.modrinth.com/data/NNAgCjsB/versions/QA5fog9j/entityculling-neoforge-1.11.1-mc26.3.jar
      - https://cdn.modrinth.com/data/BVzZfTc1/versions/Hs3N31ud/entity_texture_features-7.2.4-26.3-fabric.jar
      - https://cdn.modrinth.com/data/4I1XuqiY/versions/kdDVwkgV/entity_model_features-3.3.8-26.3-fabric.jar
      - https://cdn.modrinth.com/data/P7dR8mSH/versions/bNnaTiuM/fabric-api-0.161.0%2B26.3.jar
      - https://cdn.modrinth.com/data/Ht0RRAt0/versions/zqV1KmW2/FastTrading-0.2.4%2B26.3.jar
      - https://cdn.modrinth.com/data/XeEZ3fK2/versions/QzwNJy7n/freecam-fabric-1.5.0-alpha.1%2Bmc26.3.jar
      - https://cdn.modrinth.com/data/5ZwdcRci/versions/3MP9UR23/ImmediatelyFast-Fabric-1.17.1%2B26.3.jar
      - https://cdn.modrinth.com/data/gvQqBUqZ/versions/WXHRsMRl/lithium-fabric-0.26.1%2Bmc26.3.jar
      - https://cdn.modrinth.com/data/mOgUt4GM/versions/lcxkZSq6/modmenu-21.0.0-beta.1.jar
      - https://cdn.modrinth.com/data/51shyZVL/versions/zL2UEFXS/moreculling-fabric-26.3-1.9.0-beta.1.jar
      - https://cdn.modrinth.com/data/TnOXNf5e/versions/7nzkbVPa/peek-fabric-1.6.0%2B26.3.jar
      - https://cdn.modrinth.com/data/fCpuZIcM/versions/MIlOIpGV/resourcepackchecker-fabric-1.2.2%2B26.3.jar
      - https://cdn.modrinth.com/data/2M01OLQq/versions/Cj9VEeGt/shulkerboxtooltip-fabric-5.4.2%2B26.3.jar

      - https://cdn.modrinth.com/data/AANobbMI/versions/bAZQdGpg/sodium-fabric-0.9.2%2Bmc26.3.jar
      - https://cdn.modrinth.com/data/b93awgkg/versions/WL6fnRhA/status-fabric-1.1.0%2B26.3.jar
      - https://cdn.modrinth.com/data/9eGKb6K1/versions/OLnMVWXy/voicechat-fabric-2.6.24%2B26.3.jar
    data_packs:
    # Mods for 1.21.10
      - https://cdn.modrinth.com/data/v1U62WLz/versions/gT5GHeMS/Statistic-Books-MC_v1.6.3.zip
    # Mods for 1.21.11
      - https://cdn.modrinth.com/data/Cfqq3Wh1/versions/4qntY0gW/armor_statues_v2.16.1.zip
      - https://cdn.modrinth.com/data/2pK3w13d/versions/duCEKGMs/custom_roleplay_data_v1.6.zip
      - https://cdn.modrinth.com/data/1s7zUX2O/versions/fOI0qHKG/name_formatting_station_v2.9.zip

    vanilla_tweaks_post_url: "https://vanillatweaks.net/assets/server/zipdatapacks.php"
    decorative_cosmetic: ["wandering trades", "armor statues", "more mob heads", "player head drops", "silence mobs"]
    informative: ["spawning spheres", "wandering trader announcements", "durability ping"]
    packs_json: |
          {"decorative-cosmetic": {{ decorative_cosmetic | to_json }}, "informative": {{ informative | to_json }}}
    vanilla_tweaks_body: "packs={{ packs_json | urlencode }}&version=1.21"
    vanilla_tweaks_download_dest: "/tmp/VanillaTweaks_UNZIP_ME.zip"
    tmux_session: minecraft
    tmux_window: fabric
    java_opts: "-server -Xmx8G -Xms8G -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1"
    #og_opts: "-server -Xmx8G -Xms8G -XX:+UseZGC -XX:+ZGenerational"
  tasks: 
    - name: stop minecraft if started
      systemd:
        name: minecraft-server
        state: stopped
        enabled: no
      ignore_errors: yes
      become: true
      become_user: "{{ root_user }}"
    - name: update cache on Ubuntu
      when: ansible_os_family == "Debian"
      become: true
      become_user: "{{ root_user }}"
      apt: 
        update_cache: yes
        cache_valid_time: 3600
    - name: update cache on RedHat
      when: ansible_os_family == "RedHat"
      become: true
      become_user: "{{ root_user }}"
      dnf:
        update_cache: yes
    - name: install packages on Ubuntu
      when: ansible_os_family == "Debian"
      become: true
      become_user: "{{ root_user }}"
      apt:
        state: present
        name: "{{ packages }}"
    - name: install packages on RedHat
      when: ansible_os_family == "RedHat"
      become: true
      become_user: "{{ root_user }}"
      dnf:
        state: present
        name: "{{ packages }}"
    - name: install Java on Ubuntu
      when: ansible_os_family == "Debian"
      become: true
      become_user: "{{ root_user }}"
      apt:
        name: openjdk-21-jdk
        state: present
    - name: install Java on RedHat
      when: ansible_os_family == "RedHat"
      become: true
      become_user: "{{ root_user }}"
      dnf:
        name: jdk-21-headless
        state: present
    - name: create password for minecraft user
      shell: openssl passwd -1 -salt $(openssl rand -base64 6) "{{ minecraft_user }}" | cut -d':' -f2
      register: hashed_password
    - name: create minecraft group
      group: 
        state: present
        name: "{{ minecraft_group }}"
        system: yes
      become: true
      become_user: "{{ root_user }}"
    - name: create minecraft user
      user: 
        name: "{{ minecraft_user }}"
        group: "{{ minecraft_group }}"
        comment: Minecraft User
        shell: /bin/bash
        password: "{{ hashed_password.stdout }}"
        state: present
      become: true
      become_user: "{{ root_user }}"
    - name: create backup directory
      file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0755'
        owner: "{{ minecraft_user }}"
        group: "{{ minecraft_group }}"
      become: true
      become_user: "{{ root_user }}"
    - name: create minecraft directory
      file: 
        path: "{{ minecraft_home }}"
        state: directory
        mode: '0755'
        owner: "{{ minecraft_user }}"
        group: "{{ minecraft_group }}"
      become: true
      become_user: "{{ root_user }}"
    - name: download minecraft
      get_url: 
        url: "{{ download_url }}"
        dest: "{{ minecraft_home }}/server.jar"
      become: true
      become_user: "{{ minecraft_user }}"
    - name: check if server.properties and eula.txt exist
      stat:
        path: "{{ minecraft_home }}/server.properties"
      register: server_properties
      become: true
      become_user: "{{ minecraft_user }}"
    - name: check if eula.txt exists
      stat: 
        path: "{{ minecraft_home }}/eula.txt"
      register: eula
      become: true
      become_user: "{{ minecraft_user }}"
    - name: initial run to generate eula and server.properties
      shell: echo "stop" | java -jar {{ minecraft_home }}/server.jar nogui
      args:
        chdir: "{{ minecraft_home }}"
      become: true
      become_user: "{{ minecraft_user }}"
      ignore_errors: yes
      when: eula.stat.exists == false or server_properties.stat.exists == false
    - name: accept EULA
      lineinfile:
        path: "{{ minecraft_home }}/eula.txt"
        regexp: '^eula=false'
        line: eula=true
      become: true
      become_user: "{{ minecraft_user }}"
    - name: set seed
      lineinfile:
        path: "{{ minecraft_home }}/server.properties"
        regexp: '^level-seed='
        line: level-seed={{ level_seed }}
      become: true
      become_user: "{{ minecraft_user }}"
    - name: set motd
      lineinfile:
        path: "{{ minecraft_home }}/server.properties"
        regexp: '^motd='
        line: motd={{ motd_message }}
      become: true  
      become_user: "{{ minecraft_user }}"
    - name: set level name
      lineinfile:
        path: "{{ minecraft_home }}/server.properties"
        regexp: '^level-name='
        line: level-name={{ level_name }}
      become: true
      become_user: "{{ minecraft_user }}"
    - name: set view distance
      lineinfile:
        path: "{{ minecraft_home }}/server.properties"
        regexp: '^view-distance='
        line: view-distance={{ view_distance }}
      become: true
      become_user: "{{ minecraft_user }}"
    - name: set spawn protection
      lineinfile:
        path: "{{ minecraft_home }}/server.properties"
        regexp: '^spawn-protection='
        line: spawn-protection={{ spawn_protection }}
      become: true
      become_user: "{{ minecraft_user }}"
    - name: set difficuly to hard
      lineinfile:
        path: "{{ minecraft_home }}/server.properties"
        regexp: '^difficulty='
        line: difficulty={{ difficulty }}
      become: true
      become_user: "{{ minecraft_user }}"
    - name: create systemd service
      template: 
        src: minecraft-server.service 
        dest: /etc/systemd/system/minecraft-server.service
        owner: "{{ root_user }}"
        group: "{{ root_group }}"
      become: true
      become_user: "{{ root_user }}"
    - name: create start script
      template:
        src: minecraft-server-start.sh
        dest: "{{ minecraft_home }}/minecraft-server-start.sh"
        mode: 0755
      become: true
      become_user: "{{ minecraft_user }}"
    - name: create stop script
      template:
        src: minecraft-server-stop.sh
        dest: "{{ minecraft_home }}/minecraft-server-stop.sh"
        mode: 0755
      become: true
      become_user: "{{ minecraft_user }}"
    - name: create setup script
      template:
        src: setup-minecraft-server.sh
        dest: "{{ minecraft_home }}/setup-minecraft-server.sh"
        mode: 0755
      become: true
      become_user: "{{ minecraft_user }}"
    - name: setup backup script
      template:
        src: backup-minecraft-server.sh
        dest: "{{ minecraft_home }}/backup-minecraft-server.sh"
        mode: 0755
      become: true
      become_user: "{{ minecraft_user }}"
    - name: setup whitelist file
      template:
        src: whitelist.json
        dest: "{{ minecraft_home }}/whitelist.json"
        mode: 0644
      become: true
      become_user: "{{ minecraft_user }}"

    - name: Query Modrinth API for server mods compatible with {{ minecraft_version }}
      ansible.builtin.uri:
        url: >-
          https://api.modrinth.com/v2/project/{{ item }}/version?loaders=%5B%22{{ modloader }}%22%5D&game_versions=%5B%22{{ minecraft_version }}%22%5D
        method: GET
        headers:
          User-Agent: "HolmesCraft-AnsibleDeploy/1.0 (admin@holmescraft.internal)"
        return_content: true
      loop: "{{ server_mod_slugs }}"
      register: mod_api_responses
      check_mode: false
      tags: [mods]

    - name: Fail if any server mod is missing a compatible release
      ansible.builtin.assert:
        that:
          - item.json is defined
          - (item.json | length) > 0
        fail_msg: "Mod '{{ item.item }}' has NO compatible release found for Minecraft {{ minecraft_version }} on {{ modloader }}!"
      loop: "{{ mod_api_responses.results }}"
      tags: [mods]

    - name: Ensure server mods directory exists
      ansible.builtin.file:
        path: "{{ mods_dir }}"
        state: directory
        owner: "{{ minecraft_user }}"
        group: "{{ minecraft_group }}"
        mode: '0755'
      become: true
      become_user: "{{ root_user }}"
      tags: [mods]

    - name: Purge old JARs to prevent multi-version collision
      ansible.builtin.shell: "rm -f {{ mods_dir }}/*.jar"
      become: true
      become_user: "{{ minecraft_user }}"
      # tags: [mods]

    - name: Download verified server mods
      ansible.builtin.get_url:
        url: "{{ (item.json[0].files | selectattr('primary', 'defined') | selectattr('primary') | list | first | default(item.json[0].files[0])).url }}"
        dest: "{{ mods_dir }}/{{ (item.json[0].files | selectattr('primary', 'defined') | selectattr('primary') | list | first | default(item.json[0].files[0])).filename }}"
        owner: "{{ minecraft_user }}"
        group: "{{ minecraft_group }}"
        mode: '0644'
      loop: "{{ mod_api_responses.results }}"
      become: true
      become_user: "{{ minecraft_user }}"
      tags: [mods]

    - name: Ensure world and datapacks directories exist
      ansible.builtin.file:
        path: "{{ datapacks_dir }}"
        state: directory
        mode: '0755'
        owner: "{{ minecraft_user }}"
        group: "{{ minecraft_group }}"
      become: true
      become_user: "{{ minecraft_user }}"

    - name: Query Modrinth API for datapacks compatible with {{ minecraft_version }}
      ansible.builtin.uri:
        url: >-
          https://api.modrinth.com/v2/project/{{ item }}/version?loaders=%5B%22datapack%22%5D&game_versions=%5B%22{{ minecraft_version }}%22%5D
        method: GET
        headers:
          User-Agent: "HolmesCraft-AnsibleDeploy/1.0 (admin@holmescraft.internal)"
        return_content: true
      loop: "{{ server_datapack_slugs }}"
      register: datapack_api_responses

    - name: Purge old Modrinth datapack archives
      ansible.builtin.shell: "rm -f {{ datapacks_dir }}/*.zip"
      become: true
      become_user: "{{ minecraft_user }}"

    - name: Download verified Modrinth datapacks
      ansible.builtin.get_url:
        url: "{{ (item.json[0].files | selectattr('primary', 'defined') | selectattr('primary') | list | first | default(item.json[0].files[0])).url }}"
        dest: "{{ datapacks_dir }}/{{ (item.json[0].files | selectattr('primary', 'defined') | selectattr('primary') | list | first | default(item.json[0].files[0])).filename }}"
        owner: "{{ minecraft_user }}"
        group: "{{ minecraft_group }}"
        mode: '0644'
      loop: "{{ datapack_api_responses.results }}"
      when: (item.json | length) > 0
      become: true
      become_user: "{{ minecraft_user }}"

    # - name: install mods
    #   get_url:
    #     url: "{{ item }}"
    #     dest: "{{ minecraft_home }}/mods/{{ item | basename }}"
    #   with_items: "{{ fabric_mods }}"
    #   become: true
    #   become_user: "{{ minecraft_user }}"
    # - name: ensure world and datapacks directories exist
    #   file:
    #     path: "{{ minecraft_home }}/{{ level_name }}/datapacks"
    #     state: directory
    #     mode: '0755'
    #     owner: "{{ minecraft_user }}"
    #     group: "{{ minecraft_group }}"
    #   become: true
    #   become_user: "{{ minecraft_user }}"
    # - name: download the data packs
    #   get_url:
    #     url: "{{ item }}"
    #     dest: "{{ minecraft_home }}/{{ level_name }}/datapacks/{{ item | basename }}"
    #   with_items: "{{ data_packs }}"
    #   become: true
    #   become_user: "{{ minecraft_user }}"

    - name: Prepare POST body for VanillaTweaks
      uri:
        url: "{{ vanilla_tweaks_post_url }}"
        method: POST
        body_format: form-urlencoded
        body: "{{ vanilla_tweaks_body }}"
        return_content: yes
        status_code: 200
      register: vanilla_tweaks_post_response

    - name: Debug POST response
      debug:
        var: vanilla_tweaks_post_response

    - name: Debug POST body being sent
      debug:
        msg: "POST body: {{ vanilla_tweaks_body | urlencode }}"

    - name: Validate response contains 'link'
      fail:
        msg: "The response does not contain a 'link' attribute: {{ vanilla_tweaks_post_response }}"
      when: vanilla_tweaks_post_response.json.link is not defined

    - name: Extract download URL from response
      set_fact:
        download_url: "https://vanillatweaks.net{{ vanilla_tweaks_post_response.json.link }}"

    - name: Download file from received URL
      get_url:
        url: "{{ download_url }}"
        dest: "{{ vanilla_tweaks_download_dest }}"

    - name: Unarchive the downloaded VanillaTweaks file
      unarchive:
        src: "{{ vanilla_tweaks_download_dest }}"
        dest: "{{ minecraft_home }}/{{ level_name }}/datapacks"
        remote_src: yes
      become: true
      become_user: "{{ minecraft_user }}"

    - name: enable and start minecraft-server
      systemd:
        name: minecraft-server
        enabled: yes
        state: started
      become: true
      become_user: "{{ root_user }}"
    - name: validate server is up and running by checking the logs
      shell: tail -n 20 {{ minecraft_home }}/logs/latest.log
      register: server_logs
      until: '"[Server thread/INFO]: Done" in server_logs.stdout'
      retries: 10
      delay: 5
      become: true
      become_user: "{{ minecraft_user }}"
    - name: run final server setup script
      shell: "{{ minecraft_home }}/setup-minecraft-server.sh"
      become: true
      become_user: "{{ root_user }}"
    - name: setup hourly cron job for backups
      cron:
        name: "backup-minecraft-server"
        job: "{{ minecraft_home }}/backup-minecraft-server.sh"
        minute: 0
        hour: "*"
        user: "{{ minecraft_user }}"
      become: true
      become_user: "{{ root_user }}"
    - name: Copy Minecraft Firewalld service file
      template:
        src: minecraft.xml
        dest: /etc/firewalld/services/minecraft.xml
        mode: '0644'
      become: true
      become_user: "{{ root_user }}"
    - name: Reload Firewalld to apply new service
      command: firewall-cmd --reload
      become: true
      become_user: "{{ root_user }}"
    - name: Enable Minecraft Firewalld service
      firewalld:
        service: minecraft
        permanent: yes
        state: enabled
      become: true
      become_user: "{{ root_user }}"
    - name: Reload Firewalld after enabling service
      command: firewall-cmd --reload
      become: true
      become_user: "{{ root_user }}"
    - name: Setup Complete
      debug: 
        msg: "Setup Complete"

